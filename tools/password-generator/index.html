<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="../../resources/sparkle.png" sizes="192x192" />
    <title>Password & Token Generator | Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-bar">
        <a href="../../extra/index.html" class="back-link">← Extras & Tools</a>
        <a href="../../index.html" class="home-link">Home</a>
    </div>

    <div class="header-section">
        <h1>PASSWORD & TOKEN GENERATOR</h1>
        <p class="subtitle">Cryptographically secure random password, PIN, and passphrase generator with real-time entropy calculation.</p>
    </div>

    <div class="app-card">
        <!-- Result Display Box -->
        <div class="result-wrapper">
            <div class="result-text" id="passwordOutput">Click Generate</div>
            <div class="result-actions">
                <button class="action-btn" id="regenerateBtn" title="Generate New Password">🔄</button>
                <button class="action-btn copy-btn" id="copyBtn" title="Copy to Clipboard">
                    📋
                    <span class="copied-tooltip" id="copiedTooltip">Copied!</span>
                </button>
            </div>
        </div>

        <!-- Strength / Entropy Bar -->
        <div class="strength-container">
            <div class="strength-labels">
                <span id="strengthText">Strength: Strong</span>
                <span id="entropyText">Entropy: 78 bits</span>
            </div>
            <div class="strength-track">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="crack-time" id="crackTime">Estimated crack time: 2,400 years</div>
        </div>

        <!-- Mode Selector -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="password">Password</button>
            <button class="mode-tab" data-mode="passphrase">Memorable Passphrase</button>
            <button class="mode-tab" data-mode="pin">Numeric PIN</button>
        </div>

        <!-- Length Slider -->
        <div class="control-group" id="lengthGroup">
            <div class="control-header">
                <label for="lengthSlider">Length: <strong id="lengthValue">16</strong></label>
                <div class="quick-presets">
                    <button class="preset-btn" data-len="12">12</button>
                    <button class="preset-btn active" data-len="16">16</button>
                    <button class="preset-btn" data-len="24">24</button>
                    <button class="preset-btn" data-len="32">32</button>
                </div>
            </div>
            <input type="range" id="lengthSlider" min="6" max="64" value="16">
        </div>

        <!-- Passphrase Words Slider -->
        <div class="control-group" id="wordsGroup" style="display: none;">
            <div class="control-header">
                <label for="wordsSlider">Number of Words: <strong id="wordsValue">4</strong></label>
            </div>
            <input type="range" id="wordsSlider" min="3" max="8" value="4">
        </div>

        <!-- Checkbox Options -->
        <div class="options-grid" id="optionsGrid">
            <label class="checkbox-label">
                <input type="checkbox" id="chkUpper" checked>
                <span>Uppercase (A-Z)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chkLower" checked>
                <span>Lowercase (a-z)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chkNumbers" checked>
                <span>Numbers (0-9)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chkSymbols" checked>
                <span>Symbols (!@#$%^&*)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chkNoAmbiguous">
                <span>Exclude Ambiguous (I, l, 1, O, 0)</span>
            </label>
        </div>

        <button class="generate-btn" id="mainGenerateBtn">Generate Password</button>

        <!-- Recent History -->
        <div class="history-section">
            <div class="history-header">
                <span>Recent History</span>
                <button class="clear-history-btn" id="clearHistoryBtn">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">No generated passwords yet.</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
